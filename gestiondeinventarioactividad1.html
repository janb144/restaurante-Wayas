<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestión de Insumos</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="container py-5">
    <h2 class="text-center mb-4 title-wayas">🛠️ Gestión de Insumos</h2>

    <!-- Formulario para agregar nuevo insumo -->
    <div class="card mb-4 shadow">
      <div class="card-body">
        <h5 class="card-title">➕ Agregar nuevo insumo</h5>
        <form id="formNuevoInsumo" class="row g-3">
          <div class="col-md-4">
            <label for="nombreInsumo" class="form-label">Nombre del insumo</label>
            <input type="text" class="form-control" id="nombreInsumo" required>
          </div>
          <div class="col-md-4">
            <label for="categoriaInsumo" class="form-label">Categoría</label>
            <select class="form-select" id="categoriaInsumo">
              <option>Verduras</option>
              <option>Carnes</option>
              <option>Frutas</option>
              <option>Otros</option>
            </select>
          </div>
          <div class="col-md-4">
            <label for="proveedor" class="form-label">Proveedor (opcional)</label>
            <input type="text" class="form-control" id="proveedor">
          </div>
          <div class="col-md-4">
            <label for="cantidadInsumo" class="form-label">Cantidad actual</label>
            <input type="number" class="form-control" id="cantidadInsumo" required>
          </div>
          <div class="col-md-4">
            <label for="unidadMedida" class="form-label">Unidad de medida</label>
            <input type="text" class="form-control" id="unidadMedida" placeholder="Ej. kg, litros, unidades" required>
          </div>
          <div class="col-md-4">
            <label for="fechaVencimiento" class="form-label">Fecha de vencimiento (opcional)</label>
            <input type="date" class="form-control" id="fechaVencimiento">
          </div>
          <div class="col-md-12">
            <label class="form-label">Configurar parámetros de estado de stock</label>
            <div class="input-group">
              <span class="input-group-text">Bajo</span>
              <input type="number" class="form-control" placeholder="Ej. 5" required>
              <span class="input-group-text">Moderado</span>
              <input type="number" class="form-control" placeholder="Ej. 10" required>
              <span class="input-group-text">Suficiente</span>
              <input type="number" class="form-control" placeholder="Ej. 20" required>
            </div>
          </div>
          <div class="col-12 text-end">
            <button type="submit" class="btn btn-primary">Guardar insumo</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Filtros para editar insumos -->
    <div class="row mb-3">
      <div class="col-md-4">
        <label for="buscarInsumo" class="form-label">Buscar insumo</label>
        <input type="text" class="form-control" id="buscarInsumo" placeholder="Ej. Tomate">
      </div>
      <div class="col-md-4">
        <label for="filtrarCategoria" class="form-label">Filtrar por categoría</label>
        <select class="form-select" id="filtrarCategoria">
          <option value="">Todas</option>
          <option>Verduras</option>
          <option>Carnes</option>
          <option>Frutas</option>
          <option>Otros</option>
        </select>
      </div>
      <div class="col-md-4">
        <label for="filtrarProveedor" class="form-label">Filtrar por proveedor</label>
        <input type="text" class="form-control" id="filtrarProveedor" placeholder="Ej. Distribuidora Lima">
      </div>
    </div>

<!-- Sección: Insumos agregados -->
<div class="card shadow">
  <div class="card-body">
    <h5 class="card-title">📦 Insumos agregados</h5>
    <table class="table table-bordered table-hover">
      <thead class="table-light">
        <tr>
          <th>Nombre</th>
          <th>Categoría</th>
          <th>Cantidad</th>
          <th>Unidad</th>
          <th>Proveedor</th>
          <th>Fecha de vencimiento</th>
          <th>Stock (B/M/S)</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Tomate</td>
          <td>Verduras</td>
          <td>5</td>
          <td>kg</td>
          <td>Distribuidora Lima</td>
          <td>2025-11-15</td>
          <td>2 / 5 / 7</td>
          <td class="d-flex gap-2">
            <button class="btn btn-sm btn-warning" onclick="cargarInsumoEnFormulario('Tomate')">✏️ Editar</button>
            <button class="btn btn-sm btn-danger" onclick="confirmarEliminacion('Tomate')">🗑️ Eliminar</button>
          </td>
        </tr>
        <tr>
          <td>Pollo</td>
          <td>Carnes</td>
          <td>10</td>
          <td>kg</td>
          <td>Carnes del Norte</td>
          <td>2025-11-20</td>
          <td>3 / 6 / 10</td>
          <td class="d-flex gap-2">
            <button class="btn btn-sm btn-warning" onclick="cargarInsumoEnFormulario('Pollo')">✏️ Editar</button>
            <button class="btn btn-sm btn-danger" onclick="confirmarEliminacion('Pollo')">🗑️ Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

    <!-- Script de confirmación de eliminación -->
    <script>
      function confirmarEliminacion(nombre) {
        if (confirm(`¿Estás seguro de que deseas eliminar el insumo "${nombre}" del sistema? Esta acción no se puede deshacer.`)) {
          alert(`✅ Insumo "${nombre}" eliminado correctamente.`);
          // Aquí iría la lógica para eliminar el insumo de la base de datos
        }
      }
    </script>
  </div>

  <!-- Validación de duplicados -->
  <script>
    document.getElementById("formNuevoInsumo").addEventListener("submit", function (e) {
      e.preventDefault();
      const nuevoNombre = document.getElementById("nombreInsumo").value.trim().toLowerCase();
      const insumosExistentes = ["tomate", "pollo"]; // Simulación de insumos ya registrados
      if (insumosExistentes.includes(nuevoNombre)) {
        alert("⚠️ El insumo ya está registrado en el sistema.");
      } else {
        alert("✅ Insumo guardado correctamente.");
        // Aquí iría la lógica para guardar en base de datos
      }
    });
  </script>
  <script>
    function cargarInsumoEnFormulario(nombre) {
      // Simulación de datos precargados (puedes reemplazar con lógica real)
      const datos = {
        "Tomate": {
          nombre: "Tomate",
          categoria: "Verduras",
          unidad: "kg",
          cantidad: 5,
          proveedor: "Distribuidora Lima",
          fecha: "2025-11-15",
          stock: { bajo: 2, moderado: 5, suficiente: 7 }
        },
        "Pollo": {
          nombre: "Pollo",
          categoria: "Carnes",
          unidad: "kg",
          cantidad: 7,
          proveedor: "Carnes del Norte",
          fecha: "2025-11-20",
          stock: { bajo: 3, moderado: 8, suficiente: 15 }
        }
      };

      const insumo = datos[nombre];
      if (insumo) {
        document.getElementById("nombreInsumo").value = insumo.nombre;
        document.getElementById("categoriaInsumo").value = insumo.categoria;
        document.getElementById("unidadMedida").value = insumo.unit;
        document.getElementById("cantidadInsumo").value = insumo.cantidad;
        document.getElementById("proveedor").value = insumo.proveedor;
        document.getElementById("fechaVencimiento").value = insumo.fecha;
        const inputsStock = document.querySelectorAll(".input-group input");
        inputsStock[0].value = insumo.stock.bajo;
        inputsStock[1].value = insumo.stock.moderado;
        inputsStock[2].value = insumo.stock.suficiente;
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
